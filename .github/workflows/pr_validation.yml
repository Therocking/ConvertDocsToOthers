name: Validate pull request code

on:
  pull_request:
    branches: ["dev"]

jobs:
  test:
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout Repository
      - uses: actions/checkout@v4

      - name: Setup Dotnet
      - uses: actions/setup-dotnet@v4

      - name: Build Project
      - run: dotnet build
