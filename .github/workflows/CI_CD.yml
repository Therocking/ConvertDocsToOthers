name: Build and Deploy .NET App to Azure Web App for Containers

on:
  push:
    branches: ["dev"]

env:
  AZURE_WEBAPP_NAME: htmltopdfconverter2
  REGISTRY_NAME: docker.io
  IMAGE_NAME: ${{ secrets.REGISTRY_USERNAME }}/convert_api:${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_NAME }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build Docker image
      run: docker build -t ${{ env.IMAGE_NAME }} -f ./ConvertDocsToOthers/Dockerfile .

    - name: Push Docker image
      run: docker push 

    - name: 'Login to Azure'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App for Containers
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        images: ${{ env.IMAGE_NAME }}
