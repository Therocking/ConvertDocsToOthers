name: Build and Deploy .NET App to Azure Web App for Containers

on:
  push:
    branches: ["dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: htmltopdfconverter2
  REGISTRY_NAME: docker.io
  IMAGE_NAME: ${{ secrets.REGISTRY_USERNAME }}/convert_api:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_NAME }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and push Docker image with cache
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./ConvertDocsToOthers/Dockerfile
        push: true
        tags: ${{ env.IMAGE_NAME }}
        cache-from: type=gha # type=registry,ref=${{ secrets.REGISTRY_USERNAME }}/convert_api:cache
        cache-to: type=gha,mode=max # type=registry,ref=${{ secrets.REGISTRY_USERNAME }}/convert_api:cache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 'Login to Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
  
      - name: Deploy to Azure Web App for Containers
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ needs.build.outputs.image_name }}
